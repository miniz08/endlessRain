services:
  api_gateway:
    build:
      context: ./api_gateway
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-longseason-dev-access-token-secret}
      JWT_SECRET: ${JWT_SECRET:-longseason-dev-access-token-secret}
      USER_SERVICE_URL: http://user_service:3003
      BLOG_SERVICE_URL: http://blog_service:3002
      AI_SERVICE_URL: http://ai_service:3004
      CHAT_SERVICE_URL: http://chat_service:3005
      CORS_ORIGIN: "true"
      RATE_LIMIT_MAX: 1000
    expose:
      - "3001"
    depends_on:
      - user_service
      - blog_service
      - ai_service
      - chat_service

  user_service:
    build:
      context: ./user_service
    environment:
      PORT: 3003
      DATABASE_URL: ${DATABASE_URL}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-longseason-dev-access-token-secret}
      CORS_ORIGIN: "true"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      MEDIA_STORAGE_ROOT: /media/img/uni
      MEDIA_PUBLIC_BASE: ${MEDIA_PUBLIC_BASE:-/media/img/uni}
      MEDIA_IMAGE_MAX_BYTES: ${MEDIA_IMAGE_MAX_BYTES:-2097152}
      MEDIA_SMALL_IMAGE_MAX_BYTES: ${MEDIA_SMALL_IMAGE_MAX_BYTES:-102400}
    volumes:
      - ${MEDIA_HOST_DIR:-/media/img/uni}:/media/img/uni
    expose:
      - "3003"

  blog_service:
    build:
      context: ./blog_service
    environment:
      PORT: 3002
      DATABASE_URL: ${DATABASE_URL}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-longseason-dev-access-token-secret}
      AI_SERVICE_URL: http://ai_service:3004
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-longseason-dev-ai-internal-token}
      AI_ANALYSIS_ON_CREATE: "${AI_ANALYSIS_ON_CREATE:-true}"
      CORS_ORIGIN: "true"
    expose:
      - "3002"
    depends_on:
      - ai_service

  ai_service:
    build:
      context: ./ai_service
    environment:
      PORT: 3004
      DATABASE_URL: ${DATABASE_URL}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.siliconflow.cn/v1}
      AI_CHAT_PATH: ${AI_CHAT_PATH:-/chat/completions}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-Qwen/QwQ-32B}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-longseason-dev-ai-internal-token}
      CORS_ORIGIN: "true"
    expose:
      - "3004"

  chat_service:
    build:
      context: ./chat_service
    environment:
      PORT: 3005
      DATABASE_URL: ${DATABASE_URL}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-longseason-dev-access-token-secret}
      CORS_ORIGIN: "true"
    expose:
      - "3005"

  frontend:
    build:
      context: ./mofukaze
    ports:
      - "${FRONTEND_HTTP_PORT:-800}:80"
    volumes:
      - ${MEDIA_HOST_DIR:-/media/img/uni}:/media/img/uni:ro
    depends_on:
      - api_gateway
